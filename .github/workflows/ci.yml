
name: GitHub Actions CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment
        shell: powershell
        env:
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ vars.DB_USER }}
          APP_PORT: ${{ vars.APP_PORT }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          $required = @(
            "DB_HOST", "DB_PORT", "DB_NAME",
            "DB_USER", "APP_PORT", "DB_PASSWORD",
            "APP_SECRET", "API_KEY"
          )

          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "$name is missing"
            }
          }

          @(
            "DB_HOST=$env:DB_HOST"
            "DB_PORT=$env:DB_PORT"
            "DB_NAME=$env:DB_NAME"
            "DB_USER=$env:DB_USER"
            "DB_PASSWORD=$env:DB_PASSWORD"
            "APP_PORT=$env:APP_PORT"
            "APP_SECRET=$env:APP_SECRET"
            "API_KEY=$env:API_KEY"
          ) | Set-Content -Path .env -Encoding ascii

          New-Item -ItemType Directory -Force artifacts | Out-Null

          "Environment prepared. Secret values are not included." |
            Set-Content artifacts/environment-report.txt

      - name: Start Docker Compose
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          docker compose down --remove-orphans
          if ($LASTEXITCODE -ne 0) {
            throw "Docker Compose down failed"
          }
          docker compose up -d --build
          if ($LASTEXITCODE -ne 0) {
            throw "Docker Compose failed"
          }

      - name: Wait and test application
        shell: powershell
        env:
          APP_PORT: ${{ vars.APP_PORT }}
          DB_USER: ${{ vars.DB_USER }}
          DB_NAME: ${{ vars.DB_NAME }}
        run: |
          $ErrorActionPreference = "Stop"
          $health = $null

          for ($i = 0; $i -lt 30; $i++) {
            try {
              $health = Invoke-RestMethod "http://localhost:$($env:APP_PORT)/health"
              if ($health.status -eq "healthy") {
                break
              }
            }
            catch {
              Start-Sleep -Seconds 3
            }
          }

          if ($null -eq $health -or $health.status -ne "healthy") {
            throw "Application or database is unhealthy"
          }

          $api = Invoke-RestMethod "http://localhost:$($env:APP_PORT)/api/data"

          $dbCount = docker compose exec -T db psql -U $env:DB_USER -d $env:DB_NAME -tAc "SELECT COUNT(*) FROM items;"
          if ($LASTEXITCODE -ne 0) {
            throw "Database query failed"
          }

          $dbCount = [int]("$dbCount".Trim())
          $apiCount = [int]$api.count

          "Database count: $dbCount"
          "API count: $apiCount"

          if ($dbCount -ne $apiCount) {
            throw "Database and API counts do not match"
          }

          @(
            "Application health: OK"
            "Database connection: OK"
            "Database records: $dbCount"
            "API records: $apiCount"
            "Comparison: PASSED"
          ) | Set-Content artifacts/test-report.txt

      - name: Save Docker logs
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          docker compose ps -a |
            Out-File artifacts/compose-status.txt

          docker compose logs --no-color |
            Out-File artifacts/docker-logs.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-actions-test-results
          path: artifacts/
          if-no-files-found: warn
