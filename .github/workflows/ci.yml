
name: GitHub Actions CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment
        shell: powershell
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:DB_PASSWORD)) {
            throw "DB_PASSWORD secret is missing"
          }

          @(
            "DB_NAME=myapp"
            "DB_USER=app_user"
            "DB_PASSWORD=$env:DB_PASSWORD"
          ) | Set-Content -Path .env -Encoding ascii

          New-Item -ItemType Directory -Force artifacts | Out-Null

          "Environment prepared. Secret value is not included." |
            Set-Content artifacts/environment-report.txt

      - name: Start Docker Compose
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          docker compose down --volumes --remove-orphans
          docker compose up -d --build
          if ($LASTEXITCODE -ne 0) {
            throw "Docker Compose failed"
          }

      - name: Wait and test application
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $health = $null

          for ($i = 0; $i -lt 30; $i++) {
            try {
              $health = Invoke-RestMethod http://localhost:3000/health
              if ($health.status -eq "healthy") {
                break
              }
            }
            catch {
              Start-Sleep -Seconds 3
            }
          }

          if ($null -eq $health -or $health.status -ne "healthy") {
            throw "Application or database is unhealthy"
          }

          $api = Invoke-RestMethod http://localhost:3000/api/data

          $dbCount = docker exec github-actions-db psql -U app_user -d myapp -tAc "SELECT COUNT(*) FROM items;"
          if ($LASTEXITCODE -ne 0) {
            throw "Database query failed"
          }

          $dbCount = [int]("$dbCount".Trim())
          $apiCount = [int]$api.count

          "Database count: $dbCount"
          "API count: $apiCount"

          if ($dbCount -ne $apiCount) {
            throw "Database and API counts do not match"
          }

          @(
            "Application health: OK"
            "Database connection: OK"
            "Database records: $dbCount"
            "API records: $apiCount"
            "Comparison: PASSED"
          ) | Set-Content artifacts/test-report.txt

      - name: Save Docker logs
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          docker compose ps -a |
            Out-File artifacts/compose-status.txt

          docker compose logs --no-color |
            Out-File artifacts/docker-logs.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-actions-test-results
          path: artifacts/
          if-no-files-found: warn
